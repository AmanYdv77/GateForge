services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateforge_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://gateforge:gateforge_secret@postgres:5432/gateforge_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_CACHE_TTL_SECONDS=300
      - DEFAULT_RATE_LIMIT_RPM=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: gateforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateforge
      POSTGRES_PASSWORD: gateforge_secret
      POSTGRES_DB: gateforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateforge -d gateforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gateforge_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: gateforge_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:

name: GateForge CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Strict Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Execute Ruff Linter
        run: ruff check .

      - name: Execute Mypy Static Type Analysis
        run: mypy src

  test-suite:
    name: Integration & Unit Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gateforge
          POSTGRES_PASSWORD: gateforge_secret
          POSTGRES_DB: gateforge_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Test Suite with Pytest
        env:
          DATABASE_URL: "postgresql+asyncpg://gateforge:gateforge_secret@localhost:5432/gateforge_db"
          REDIS_URL: "redis://localhost:6379/0"
        run: pytest -v --tb=short
